# Builds Code GPT Editor for Windows, macOS and Linux and publishes the installers as a GitHub Release.
# Run it from the Actions tab: "Build Code GPT Editor" > Run workflow. It takes about 1.5 to 2.5 hours.
# Based on the VSCodium build scripts (MIT). No secrets are needed; signing is optional (see CODEGPT_BUILD.md).
name: Build Code GPT Editor

on:
  push:
    branches: [master]
    paths:
      - BUILD_NOW.txt          # change this file (any text) and push: a new build starts
  workflow_dispatch:
    inputs:
      windows:
        type: boolean
        default: true
        description: Build for Windows (x64)
      macos:
        type: boolean
        default: true
        description: Build for macOS (Apple silicon and Intel)
      linux:
        type: boolean
        default: true
        description: Build for Linux (x64 .deb, .rpm, .tar.gz)
      draft:
        type: boolean
        default: false
        description: Create the release as a draft

env:
  APP_NAME: CodeGPT
  ASSETS_REPOSITORY: ${{ github.repository }}
  BINARY_NAME: codegpt-editor
  GH_REPO_PATH: ${{ github.repository }}
  ORG_NAME: ${{ github.repository_owner }}
  VERSIONS_REPOSITORY: ${{ github.repository_owner }}/codegpt-editor-versions
  VSCODE_QUALITY: stable
  DISABLE_MSI: 'yes'
  SHOULD_BUILD_REH: 'no'
  SHOULD_BUILD_REH_WEB: 'no'
  SHOULD_BUILD_MSI: 'no'
  SHOULD_BUILD_MSI_NOUP: 'no'
  SHOULD_BUILD_SNAP: 'no'
  SHOULD_BUILD_SRC: 'no'
  SHOULD_BUILD_APPIMAGE: 'no'
  SHOULD_BUILD_CLI: 'no'
  DISABLE_UPDATE: 'yes'          # Code GPT tells people about new versions itself (see CODEGPT_BUILD.md)

permissions: {}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      RELEASE_VERSION: ${{ steps.v.outputs.RELEASE_VERSION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Make the build scripts runnable (uploads from Windows lose this)
        shell: bash
        run: find . -name "*.sh" -not -path "./vscode/*" -exec chmod +x {} +
      - id: v
        name: Pick one version number for every platform
        run: |
          MS_TAG=$( jq -r '.tag' ./upstream/stable.json )
          TIME_PATCH=$( printf "%04d" $(($(date +%-j) * 24 + $(date +%-H))) )
          echo "RELEASE_VERSION=${MS_TAG}${TIME_PATCH}" >> "$GITHUB_OUTPUT"
          echo "Code GPT Editor ${MS_TAG}${TIME_PATCH} (VS Code ${MS_TAG})"

  # ------------------------------------------------------------------ Windows
  windows-compile:
    needs: version
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.windows }}
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    env:
      OS_NAME: windows
      VSCODE_ARCH: x64
      RELEASE_VERSION: ${{ needs.version.outputs.RELEASE_VERSION }}
    outputs:
      BUILD_SOURCEVERSION: ${{ env.BUILD_SOURCEVERSION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Make the build scripts runnable (uploads from Windows lose this)
        shell: bash
        run: find . -name "*.sh" -not -path "./vscode/*" -exec chmod +x {} +
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Stamp the version into the built-in Code GPT extension
        shell: bash
        run: |
          f=src/stable/extensions/codegpt-agent/package.json
          jq --arg v "${RELEASE_VERSION}" --arg r "${GITHUB_REPOSITORY}" '.codegptEditorRelease=$v | .codegptEditorRepo=$r' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
      - name: Clone VS Code source
        run: ./get_repo.sh
      - name: Compile
        env:
          SHOULD_BUILD: 'yes'
        run: ./build.sh
      - name: Compress compiled source
        run: |
          find vscode -type f -not -path "*/node_modules/*" -not -path "vscode/.build/node/*" -not -path "vscode/.git/*" > vscode.txt
          echo "vscode/.build/extensions/node_modules" >> vscode.txt
          echo "vscode/.git" >> vscode.txt
          tar -czf vscode.tar.gz -T vscode.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vscode-windows
          path: ./vscode.tar.gz
          retention-days: 1

  windows-build:
    needs: [version, windows-compile]
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    env:
      OS_NAME: windows
      VSCODE_ARCH: x64
      RELEASE_VERSION: ${{ needs.version.outputs.RELEASE_VERSION }}
      BUILD_SOURCEVERSION: ${{ needs.windows-compile.outputs.BUILD_SOURCEVERSION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Make the build scripts runnable (uploads from Windows lose this)
        shell: bash
        run: find . -name "*.sh" -not -path "./vscode/*" -exec chmod +x {} +
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vscode-windows
      - name: Package (installers and zip)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_arch: x64
          npm_config_target_arch: x64
        run: ./build/windows/package.sh
      - name: Prepare assets
        run: ./prepare_assets.sh
      - name: Checksums
        run: ./prepare_checksums.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-windows-x64
          path: assets/
          retention-days: 7

  # ------------------------------------------------------------------ macOS
  macos:
    needs: version
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.macos }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            vscode_arch: arm64
          - runner: macos-15-intel
            vscode_arch: x64
    env:
      OS_NAME: osx
      VSCODE_ARCH: ${{ matrix.vscode_arch }}
      MAX_OLD_SPACE_SIZE: 12288
      RELEASE_VERSION: ${{ needs.version.outputs.RELEASE_VERSION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Make the build scripts runnable (uploads from Windows lose this)
        shell: bash
        run: find . -name "*.sh" -not -path "./vscode/*" -exec chmod +x {} +
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Stamp the version into the built-in Code GPT extension
        shell: bash
        run: |
          f=src/stable/extensions/codegpt-agent/package.json
          jq --arg v "${RELEASE_VERSION}" --arg r "${GITHUB_REPOSITORY}" '.codegptEditorRelease=$v | .codegptEditorRepo=$r' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
      - name: Clone VS Code source
        run: . get_repo.sh
      - name: Build
        env:
          SHOULD_BUILD: 'yes'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build.sh
      - name: Prepare assets (signs and notarizes only if the Apple secrets are set)
        env:
          CERTIFICATE_OSX_APP_PASSWORD: ${{ secrets.CERTIFICATE_OSX_APP_PASSWORD }}
          CERTIFICATE_OSX_APPLE_ID: ${{ secrets.CERTIFICATE_OSX_APPLE_ID }}
          CERTIFICATE_OSX_P12_DATA: ${{ secrets.CERTIFICATE_OSX_P12_DATA }}
          CERTIFICATE_OSX_P12_PASSWORD: ${{ secrets.CERTIFICATE_OSX_P12_PASSWORD }}
          CERTIFICATE_OSX_TEAM_ID: ${{ secrets.CERTIFICATE_OSX_TEAM_ID }}
        run: ./prepare_assets.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-macos-${{ matrix.vscode_arch }}
          path: assets/
          retention-days: 7

  # ------------------------------------------------------------------ Linux
  linux-compile:
    needs: version
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.linux }}
    runs-on: ubuntu-22.04
    env:
      OS_NAME: linux
      VSCODE_ARCH: x64
      RELEASE_VERSION: ${{ needs.version.outputs.RELEASE_VERSION }}
    outputs:
      BUILD_SOURCEVERSION: ${{ env.BUILD_SOURCEVERSION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Make the build scripts runnable (uploads from Windows lose this)
        shell: bash
        run: find . -name "*.sh" -not -path "./vscode/*" -exec chmod +x {} +
      - uses: egor-tensin/setup-gcc@a2861a8b8538f49cf2850980acccf6b05a1b2ae4 # v2.0
        with:
          version: 10
          platform: x64
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install libkrb5-dev
        run: sudo apt-get update -y && sudo apt-get install -y libkrb5-dev
      - name: Stamp the version into the built-in Code GPT extension
        shell: bash
        run: |
          f=src/stable/extensions/codegpt-agent/package.json
          jq --arg v "${RELEASE_VERSION}" --arg r "${GITHUB_REPOSITORY}" '.codegptEditorRelease=$v | .codegptEditorRepo=$r' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
      - name: Clone VS Code source
        run: ./get_repo.sh
      - name: Compile
        env:
          SHOULD_BUILD: 'yes'
        run: ./build.sh
      - name: Compress compiled source
        run: |
          find vscode -type f -not -path "*/node_modules/*" -not -path "vscode/.build/node/*" -not -path "vscode/.git/*" > vscode.txt
          echo "vscode/.build/extensions/node_modules" >> vscode.txt
          echo "vscode/.git" >> vscode.txt
          tar -czf vscode.tar.gz -T vscode.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vscode-linux
          path: ./vscode.tar.gz
          retention-days: 1

  linux-build:
    needs: [version, linux-compile]
    runs-on: ubuntu-latest
    container:
      image: vscodium/vscodium-linux-build-agent:focal-x64
    env:
      OS_NAME: linux
      VSCODE_ARCH: x64
      RELEASE_VERSION: ${{ needs.version.outputs.RELEASE_VERSION }}
      BUILD_SOURCEVERSION: ${{ needs.linux-compile.outputs.BUILD_SOURCEVERSION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Make the build scripts runnable (uploads from Windows lose this)
        shell: bash
        run: find . -name "*.sh" -not -path "./vscode/*" -exec chmod +x {} +
      - name: Install GH
        run: ./build/linux/install_gh.sh
      - name: Install dependencies
        run: ./build/linux/deps.sh
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vscode-linux
      - name: Package
        id: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_arch: x64
        run: ./build/linux/package_bin.sh
      - name: Prepare assets (.deb, .rpm, .tar.gz)
        env:
          VSCODE_SYSROOT_REPOSITORY: ${{ steps.build.outputs.VSCODE_SYSROOT_REPOSITORY }}
          VSCODE_SYSROOT_VERSION: ${{ steps.build.outputs.VSCODE_SYSROOT_VERSION }}
          VSCODE_SYSROOT_PREFIX: ${{ steps.build.outputs.VSCODE_SYSROOT_PREFIX }}
        run: ./prepare_assets.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-linux-x64
          path: assets/
          retention-days: 7

  # ------------------------------------------------------------------ the release
  release:
    needs: [version, windows-build, macos, linux-build]
    if: ${{ always() && needs.version.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.RELEASE_VERSION }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bin-*
          merge-multiple: true
          path: assets
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRAFT: ${{ inputs.draft && '--draft' || '' }}
        run: |
          ls -la assets
          NOTES="Code GPT Editor ${RELEASE_VERSION}, built on VS Code $( echo "${RELEASE_VERSION}" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]).*/\1/' ). Windows: CodeGPTUserSetup-x64-*.exe. macOS: the .dmg for your Mac (arm64 = Apple silicon). Linux: .deb, .rpm or .tar.gz."
          gh release view "${RELEASE_VERSION}" -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "${RELEASE_VERSION}" -R "${GITHUB_REPOSITORY}" --title "Code GPT Editor ${RELEASE_VERSION}" --notes "${NOTES}" ${DRAFT}
          gh release upload "${RELEASE_VERSION}" assets/* -R "${GITHUB_REPOSITORY}" --clobber
